apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-milk-app
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: fresh-milk

  template:
    metadata:
      labels:
        app: fresh-milk

    spec:
      containers:
        - name: milk-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000

          env:
            - name: DB_URL
              value: "mysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"

          envFrom:
            - configMapRef:
                name: milk-config
            - secretRef:
                name: milk-secret

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20